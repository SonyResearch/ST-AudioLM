[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "st-audiolm"
version = "0.1.0"
description = "Inference code for the final EMNLP 2026 ST-AudioLM model"
readme = "README.md"
license = "MIT AND CC-BY-NC-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "huggingface-hub>=0.34",
  "transformers>=4.57,<5",
  "peft>=0.17,<0.18",
  "safetensors>=0.4",
  "soundfile>=0.12",
]

[project.optional-dependencies]
data = [
  "datasets>=3.0",
  "pyarrow>=18",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
include = ["staudiolm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
